<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preventa de comidas — versión corregida</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2a2420;--mu:#7a6f66;--ac:#c2410c;--ac2:#fff;--bd:#e6ddd2;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#1a1613;--card:#262019;--tx:#f3ece4;--mu:#a89c90;--ac:#fb923c;--ac2:#1a1613;--bd:#3a322a;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin-inline:auto;padding:12px 14px 40px}
h1{font-size:1.25rem;margin:6px 0 10px}
h2{font-size:1.35rem;margin:0 0 6px}.intro{line-height:1.6;margin:0 0 10px}.field-label{display:block;font-weight:650;font-size:.9rem;margin:0 0 5px}.field-gap{margin-top:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:1rem}
.btn{display:block;text-align:center;text-decoration:none;padding:11px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--ac2);font-weight:700;font-size:1rem;width:100%;margin-bottom:8px}
button,.btn{cursor:pointer;transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease;touch-action:manipulation}
.btn:hover:not(:disabled){background:#9a3412;color:#fff;transform:translateY(-2px);box-shadow:0 6px 18px #0002}
.btn:active:not(:disabled),.q button:active:not(:disabled){transform:scale(.97)}
.btn:focus-visible,.q button:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
.btn.gh:hover:not(:disabled){background:var(--bd);color:var(--tx);border-color:var(--ac)}
button:disabled,.btn:disabled{cursor:wait;opacity:.65;transform:none!important;box-shadow:none!important}
.btn.is-loading:before{content:'';display:inline-block;width:14px;height:14px;margin-right:9px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.q button:hover:not(:disabled){background:var(--ac);color:var(--ac2);border-color:var(--ac);transform:translateY(-1px)}
@media(prefers-reduced-motion:reduce){button,.btn{transition:none}.btn.is-loading:before{animation:none}}
.sm{display:inline-block;width:auto;padding:6px 10px;font-size:.85rem;margin:0}
.gh{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.mu{color:var(--mu);font-size:.85rem}
.q{display:flex;align-items:center;gap:10px}
.q button{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1.2rem}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
.ok{color:var(--ok);border-color:var(--ok)}
.code{font-size:2.4rem;font-weight:800;letter-spacing:.15em}
#qr{background:#fff;display:inline-block;padding:6px;border-radius:10px;margin:8px 0}
#qr img{width:220px;height:220px;image-rendering:pixelated;display:block}
hr{border:0;border-top:1px solid var(--bd);margin:10px 0}
</style>
</head>
<body>
<h1>🍲 Preventa de comidas</h1>
<div id="v">Cargando…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const API='https://script.google.com/macros/s/AKfycbwcjKifVe8_SsM4yPeJ4WeCGN0p33McLCmzllkmVCxIWaax-cYuouRLvWcMqFlZvRiXQA/exec'; // URL de la implementacion de Apps Script (termina en /exec)
const MONEDA='$';                         // cambia el simbolo si hace falta
const Q=new URLSearchParams(location.search),$=id=>document.getElementById(id),V=$('v');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m=n=>MONEDA+Number(n).toLocaleString('es');
const ls={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
// POST con texto plano: evita preflight CORS en Apps Script
const api=async o=>(await fetch(API,{method:'POST',body:JSON.stringify(o)})).json();
const get=async q=>{const res=await fetch(API+'?'+new URLSearchParams(q),{redirect:'follow',cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);return res.json()};
const pin=()=>ls.get('pin');
let busy=false;
function loading(button,on,label='Procesando…'){
 if(!button)return;
 if(on){button.dataset.original=button.textContent;button.textContent=label;button.classList.add('is-loading');button.disabled=true;button.setAttribute('aria-busy','true')}
 else{button.textContent=button.dataset.original||button.textContent;button.classList.remove('is-loading');button.disabled=false;button.removeAttribute('aria-busy')}
}
function lockButtons(on){document.querySelectorAll('button').forEach(b=>{if(on){b.dataset.wasDisabled=String(b.disabled);b.disabled=true}else{b.disabled=b.dataset.wasDisabled==='true';delete b.dataset.wasDisabled}})}

/* ---------- CLIENTE: formulario ---------- */
let cart={},menu=[];
async function cliente(){
  try{const result=await get({a:'menu'});if(!result.ok||!Array.isArray(result.menu))throw Error(result.msg||'Menú no disponible');menu=result.menu}catch(e){V.innerHTML='<div class="card">No se pudo cargar el menú. Comprueba que la aplicación web de Apps Script esté publicada y permita acceso público. <button class="btn" onclick="cliente()">Reintentar</button></div>';return}
  V.innerHTML=`<div class="card"><h2>🛒 Realizar pedido</h2><p class="mu intro">Elige tus comidas, indica tu nombre y teléfono, y confirma el pedido. Al finalizar recibirás un código de retiro y un QR que podrás guardar en tu teléfono. No necesitas ingresar ningún código para ordenar.</p></div>`+
  `<div class="card"><label class="field-label" for="nm">Nombre</label><input id="nm" placeholder="Tu nombre" autocomplete="name" required><div class="field-gap"><label class="field-label" for="tl">Teléfono</label><input id="tl" type="tel" inputmode="tel" placeholder="Tu teléfono" autocomplete="tel" required></div></div>`+
  menu.map((p,i)=>`<div class="card row"><div><b>${esc(p.n)}</b><div class="mu">${m(p.p)}</div></div>
  <div class="q"><button type="button" aria-label="Quitar ${esc(p.n)}" onclick="qty(${i},-1)">−</button><b id="q${i}">0</b><button type="button" aria-label="Agregar ${esc(p.n)}" onclick="qty(${i},1)">+</button></div></div>`).join('')+
  `<div class="card row"><b>Total a depositar</b><b id="tt">${m(0)}</b></div>
  <button class="btn" id="go" onclick="crear()">Confirmar pedido y generar QR</button>`;
}
function qty(i,d){if(busy)return;cart[i]=Math.max(0,(cart[i]||0)+d);$('q'+i).textContent=cart[i];$('tt').textContent=m(menu.reduce((s,p,k)=>s+p.p*(cart[k]||0),0))}
async function crear(){
  if(busy)return;
  const nombre=$('nm').value.trim(),tel=$('tl').value.replace(/\D/g,'');
  const items=menu.map((p,i)=>({n:p.n,q:cart[i]||0})).filter(i=>i.q);
  if(!nombre||tel.length<7||!items.length)return alert('Completa tu nombre, tu teléfono (mínimo 7 dígitos) y al menos un plato.');
  busy=true;const btn=$('go');lockButtons(true);loading(btn,true,'Registrando pedido…');
  try{const r=await api({a:'crear',nombre,tel,items});if(!r.ok||!r.c)throw Error(r.msg||'No se pudo registrar el pedido');ls.set('mi',r.c);location.search='?c='+encodeURIComponent(r.c)}
  catch(e){alert(e.message||'No se pudo registrar el pedido. Intenta de nuevo.');loading(btn,false);lockButtons(false);busy=false}
}

/* ---------- RECIBO: QR + código + lista ---------- */
const acciones=(p,vol)=>['pendiente','pagado','entregado'].filter(s=>s!==p.estado)
  .map(s=>`<button class="btn sm ${s==='entregado'?'':'gh'}" onclick="est('${p.c}','${s}','${vol}')">${s==='entregado'?'Entregar':'Marcar '+s}</button>`).join(' ');
const EST={pendiente:['Pendiente de pago',''],pagado:['Pagado ✅','ok'],entregado:['Entregado','ok']};
async function recibo(c){
  if(busy)return;busy=true;const trigger=document.activeElement?.tagName==='BUTTON'?document.activeElement:null;if(trigger){lockButtons(true);loading(trigger,true,'Actualizando…')}
  // El comprobante es público: nunca leer ni enviar el PIN del administrador.
  let r;
  try{r=await get({a:'pedido',c})}catch(e){V.innerHTML='<div class="card">No se pudo consultar el pedido. Comprueba la conexión y el acceso público de Apps Script. <button class="btn" onclick="recibo('+JSON.stringify(c)+')">Reintentar</button></div>';busy=false;return}
  if(!r.ok){V.innerHTML='<div class="card">'+esc(r.msg||'Pedido no encontrado.')+'</div>';busy=false;return}
  const p=r.pedido,E=EST[p.estado]||['',''];
  V.innerHTML=`<div class="card" style="text-align:center"><h2>✅ Tu pedido está registrado</h2><p class="mu">Guarda tu código y QR para presentar al retirar.</p><div class="mu">Código de retiro</div><div class="code">${esc(p.c)}</div>
  <div id="qr"></div><div><span class="tag ${E[1]}">${E[0]}</span></div>
  <div class="mu" style="margin-top:6px">${esc(p.nombre)}${p.tel?' · '+esc(p.tel):''}</div></div>
  <div class="card"><b>Productos</b>${p.items.map(i=>`<div class="row" style="margin-top:8px"><span>${i.q}× ${esc(i.n)}</span><span class="mu">${m(i.p*i.q)}</span></div>`).join('')}
  <hr><div class="row"><b>Total</b><b>${m(p.total)}</b></div></div>`+
  (p.estado==='pendiente'?`<div class="card">Deposita <b>${m(p.total)}</b> y avisa al organizador. Al confirmar tu pago, este código queda válido para retirar.</div>`:'')+
  `<button class="btn" id="download" onclick="descargar()">⬇ Guardar QR y código en mi teléfono</button><button class="btn gh" onclick="recibo('${p.c}')">Actualizar estado</button>`;
  currentReceipt=p;
  try{const q=qrcode(0,'L');q.addData(location.origin+location.pathname+'?c='+encodeURIComponent(p.c));q.make();$('qr').innerHTML=q.createImgTag(6,2)}catch(e){$('qr').textContent='No se pudo generar el QR. Conserva tu código.'}
  busy=false;
}
let currentReceipt=null;
async function descargar(){
  if(busy||!currentReceipt)return;
  const b=$('download'),img=$('qr')?.querySelector('img');
  if(!img||!img.complete){alert('El QR todavía no está disponible. Intenta de nuevo.');return}
  busy=true;loading(b,true,'Preparando imagen…');
  try{
    const p=currentReceipt,canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
    canvas.width=720;canvas.height=920;
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,720,920);
    ctx.textAlign='center';ctx.fillStyle='#292524';ctx.font='bold 36px system-ui';ctx.fillText('Preventa de comidas',360,78);
    ctx.font='26px system-ui';ctx.fillText('Comprobante de pedido',360,135);
    ctx.fillStyle='#78716c';ctx.font='22px system-ui';ctx.fillText('Código de retiro',360,205);
    ctx.fillStyle='#292524';ctx.font='bold 68px system-ui';ctx.fillText(String(p.c),360,295,650);
    ctx.imageSmoothingEnabled=false;ctx.drawImage(img,160,335,400,400);
    ctx.fillStyle='#292524';ctx.font='24px system-ui';ctx.fillText('Presenta este QR al retirar',360,785);
    ctx.font='20px system-ui';ctx.fillText('Total: '+m(p.total),360,835);
    const url=canvas.toDataURL('image/png');
    const a=document.createElement('a');a.href=url;a.download='pedido-'+String(p.c).replace(/[^a-z0-9_-]/gi,'')+'.png';document.body.appendChild(a);a.click();a.remove();
  }catch(e){alert('No se pudo guardar la imagen. Puedes tomar una captura de pantalla del código y QR.')}finally{loading(b,false);busy=false}
}
async function est(c,estado,vol){
  if(busy)return;busy=true;const b=document.activeElement?.tagName==='BUTTON'?document.activeElement:null;
  lockButtons(true);loading(b,true,'Guardando…');
  try{const r=await api({a:'estado',pin:pin(),c,estado});if(!r.ok)throw Error(r.msg||'No se pudo actualizar');busy=false;vol==='a'?await admin():await recibo(c)}
  catch(e){alert(e.message||'Error de conexión');busy=false;loading(b,false);lockButtons(false)}
}

/* ---------- ORGANIZADOR ---------- */
let L=[];
async function entrar(b){
  if(busy)return;const value=$('pn').value.trim();if(!value){alert('Ingresa el PIN del organizador.');return}
  busy=true;loading(b,true,'Ingresando…');ls.set('pin',value);busy=false;await admin();
}
async function admin(){
  if(busy)return;
  if(!pin()){V.innerHTML=`<div class="card"><input id="pn" type="password" placeholder="PIN del organizador"><button class="btn" style="margin-top:8px" onclick="entrar(this)">Entrar</button></div>`;return}
  let r;try{r=await api({a:'lista',pin:pin()})}catch(e){V.innerHTML='<div class="card">No se pudo cargar el panel. <button class="btn" onclick="admin()">Reintentar</button></div>';return}
  if(!r.ok){ls.del('pin');alert('PIN incorrecto');return admin()}
  L=r.lista;
  const cobrado=L.filter(p=>p.estado!=='pendiente').reduce((s,p)=>s+p.total,0),prep={};
  L.filter(p=>p.estado==='pagado').forEach(p=>p.items.forEach(i=>prep[i.n]=(prep[i.n]||0)+i.q));
  V.innerHTML=`<div class="card"><b>Cobrado:</b> ${m(cobrado)} · ${L.length} pedidos
  <div class="mu" style="margin-top:6px">Por entregar (pagados):</div>
  ${Object.entries(prep).map(([n,q])=>`<div class="row"><span>${esc(n)}</span><b>${q}</b></div>`).join('')||'<div class="mu">Nada pendiente ✔</div>'}</div>
  <input id="bq" placeholder="Buscar código, nombre o teléfono" oninput="lista()" style="margin-bottom:10px"><div id="ls"></div>
  <button class="btn gh" onclick="ls.del('pin');location.reload()">Salir</button>`;
  lista();
}
function lista(){
  const t=($('bq')?.value||'').toLowerCase();
  $('ls').innerHTML=L.filter(p=>!t||(p.c+p.nombre+p.tel).toLowerCase().includes(t)).reverse().map(p=>`<div class="card">
  <div class="row"><b>${esc(p.c)} · ${esc(p.nombre)}</b><span class="tag ${EST[p.estado][1]}">${p.estado}</span></div>
  <div class="mu">${esc(p.tel)} · ${p.items.map(i=>i.q+'× '+esc(i.n)).join(', ')} — ${m(p.total)}</div>
  <div style="margin-top:8px">${acciones(p,'a')}</div></div>`).join('');
}
async function listaReload(){admin()}

/* ---------- ruteo ---------- */
if(API==='TESTING'||API.startsWith('PEGA'))V.textContent='Falta configurar la URL real de Apps Script en la constante API de este archivo.';
else if(Q.has('admin'))admin();
else if(Q.get('c'))recibo(Q.get('c').toUpperCase());
else cliente();
</script>
</body>
</html>
