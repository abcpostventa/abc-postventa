<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preventa de comidas</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2a2420;--mu:#7a6f66;--ac:#c2410c;--ac2:#fff;--bd:#e6ddd2;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#1a1613;--card:#262019;--tx:#f3ece4;--mu:#a89c90;--ac:#fb923c;--ac2:#1a1613;--bd:#3a322a;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin-inline:auto;padding:12px 14px 40px}
h1{font-size:1.25rem;margin:6px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:1rem}
.btn{display:block;text-align:center;text-decoration:none;padding:11px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--ac2);font-weight:700;font-size:1rem;width:100%;margin-bottom:8px}
.sm{display:inline-block;width:auto;padding:6px 10px;font-size:.85rem;margin:0}
.gh{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.mu{color:var(--mu);font-size:.85rem}
.q{display:flex;align-items:center;gap:10px}
.q button{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1.2rem}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
.ok{color:var(--ok);border-color:var(--ok)}
.code{font-size:2.4rem;font-weight:800;letter-spacing:.15em}
#qr{background:#fff;display:inline-block;padding:6px;border-radius:10px;margin:8px 0}
#qr img{width:220px;height:220px;image-rendering:pixelated;display:block}
hr{border:0;border-top:1px solid var(--bd);margin:10px 0}
</style>
</head>
<body>
<h1>🍲 Preventa de comidas</h1>
<div id="v">Cargando…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const API='https://script.google.com/macros/s/AKfycbyOUzsKM9OyVqcTKWZsph18Bq7LwZF2hRAzlmebXJdKqq-8iFVRtUbC7YAJdl9VaNXbcA/exec'; // URL de la implementacion de Apps Script (termina en /exec)
const MONEDA='$';                         // cambia el simbolo si hace falta
const Q=new URLSearchParams(location.search),$=id=>document.getElementById(id),V=$('v');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m=n=>MONEDA+Number(n).toLocaleString('es');
const ls={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
// POST con texto plano: evita preflight CORS en Apps Script
const api=async o=>(await fetch(API,{method:'POST',body:JSON.stringify(o)})).json();
const get=async q=>(await fetch(API+'?'+new URLSearchParams(q))).json();
const pin=()=>ls.get('pin');

/* ---------- CLIENTE: formulario ---------- */
let cart={},menu=[];
async function cliente(){
  try{menu=(await get({a:'menu'})).menu}catch(e){V.textContent='No se pudo cargar el menú. Intenta de nuevo.';return}
  const mi=ls.get('mi');
  V.innerHTML=(mi?`<div class="card row"><span>Ya tienes un pedido</span><a class="btn sm" href="?c=${esc(mi)}">Ver mi QR</a></div>`:'')+
  `<div class="card"><input id="nm" placeholder="Tu nombre" autocomplete="name"><input id="tl" type="tel" inputmode="tel" placeholder="Teléfono" autocomplete="tel" style="margin-top:8px"></div>`+
  menu.map((p,i)=>`<div class="card row"><div><b>${esc(p.n)}</b><div class="mu">${m(p.p)}</div></div>
  <div class="q"><button onclick="qty(${i},-1)">−</button><b id="q${i}">0</b><button onclick="qty(${i},1)">+</button></div></div>`).join('')+
  `<div class="card row"><b>Total a depositar</b><b id="tt">${m(0)}</b></div>
  <button class="btn" id="go" onclick="crear()">Generar mi QR y código</button>`;
}
function qty(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);$('q'+i).textContent=cart[i];$('tt').textContent=m(menu.reduce((s,p,k)=>s+p.p*(cart[k]||0),0))}
async function crear(){
  const nombre=$('nm').value.trim(),tel=$('tl').value.replace(/\D/g,'');
  const items=menu.map((p,i)=>({n:p.n,q:cart[i]||0})).filter(i=>i.q);
  if(!nombre||tel.length<7||!items.length)return alert('Completa tu nombre, tu teléfono (mínimo 7 dígitos) y al menos un plato.');
  $('go').disabled=true;
  try{const r=await api({a:'crear',nombre,tel,items});if(!r.ok)throw 0;ls.set('mi',r.c);location.search='?c='+r.c}
  catch(e){alert('No se pudo registrar el pedido. Intenta de nuevo.');$('go').disabled=false}
}

/* ---------- RECIBO: QR + código + lista ---------- */
const acciones=(p,vol)=>['pendiente','pagado','entregado'].filter(s=>s!==p.estado)
  .map(s=>`<button class="btn sm ${s==='entregado'?'':'gh'}" onclick="est('${p.c}','${s}','${vol}')">${s==='entregado'?'Entregar':'Marcar '+s}</button>`).join(' ');
const EST={pendiente:['Pendiente de pago',''],pagado:['Pagado ✅','ok'],entregado:['Entregado','ok']};
async function recibo(c){
  const adm=pin();let r;
  try{r=adm?await api({a:'ver',pin:adm,c}):await api({a:'pedido',c})}catch(e){V.textContent='Sin conexión.';return}
  if(!r.ok){V.innerHTML='<div class="card">'+esc(r.msg||'Pedido no encontrado.')+'</div>';return}
  const p=r.pedido,E=EST[p.estado]||['',''];
  V.innerHTML=`<div class="card" style="text-align:center"><div class="mu">Código de retiro</div><div class="code">${esc(p.c)}</div>
  <div id="qr"></div><div><span class="tag ${E[1]}">${E[0]}</span></div>
  <div class="mu" style="margin-top:6px">${esc(p.nombre)}${p.tel?' · '+esc(p.tel):''}</div></div>
  <div class="card"><b>Productos</b>${p.items.map(i=>`<div class="row" style="margin-top:8px"><span>${i.q}× ${esc(i.n)}</span><span class="mu">${m(i.p*i.q)}</span></div>`).join('')}
  <hr><div class="row"><b>Total</b><b>${m(p.total)}</b></div></div>`+
  (p.estado==='pendiente'?`<div class="card">Deposita <b>${m(p.total)}</b> y avisa al organizador. Al confirmar tu pago, este código queda válido para retirar.</div>`:'')+
  (adm?`<div class="card"><b>Organizador</b><div style="margin-top:8px">${acciones(p,'r')}</div></div><a class="btn gh" href="?admin">Panel del organizador</a>`:'')+
  `<button class="btn gh" onclick="recibo('${p.c}')">Actualizar estado</button>`;
  try{const q=qrcode(0,'L');q.addData(location.origin+location.pathname+'?c='+p.c);q.make();$('qr').innerHTML=q.createImgTag(6,2)}catch(e){}
}
async function est(c,estado,vol){
  const r=await api({a:'estado',pin:pin(),c,estado});
  if(!r.ok)alert(r.msg||'No se pudo actualizar');
  vol==='a'?admin():recibo(c);
}

/* ---------- ORGANIZADOR ---------- */
let L=[];
async function admin(){
  if(!pin()){V.innerHTML=`<div class="card"><input id="pn" type="password" placeholder="PIN del organizador"><button class="btn" style="margin-top:8px" onclick="ls.set('pin',$('pn').value);admin()">Entrar</button></div>`;return}
  const r=await api({a:'lista',pin:pin()});
  if(!r.ok){ls.del('pin');alert('PIN incorrecto');return admin()}
  L=r.lista;
  const cobrado=L.filter(p=>p.estado!=='pendiente').reduce((s,p)=>s+p.total,0),prep={};
  L.filter(p=>p.estado==='pagado').forEach(p=>p.items.forEach(i=>prep[i.n]=(prep[i.n]||0)+i.q));
  V.innerHTML=`<div class="card"><b>Cobrado:</b> ${m(cobrado)} · ${L.length} pedidos
  <div class="mu" style="margin-top:6px">Por entregar (pagados):</div>
  ${Object.entries(prep).map(([n,q])=>`<div class="row"><span>${esc(n)}</span><b>${q}</b></div>`).join('')||'<div class="mu">Nada pendiente ✔</div>'}</div>
  <input id="bq" placeholder="Buscar código, nombre o teléfono" oninput="lista()" style="margin-bottom:10px"><div id="ls"></div>
  <button class="btn gh" onclick="ls.del('pin');location.reload()">Salir</button>`;
  lista();
}
function lista(){
  const t=($('bq')?.value||'').toLowerCase();
  $('ls').innerHTML=L.filter(p=>!t||(p.c+p.nombre+p.tel).toLowerCase().includes(t)).reverse().map(p=>`<div class="card">
  <div class="row"><b>${esc(p.c)} · ${esc(p.nombre)}</b><span class="tag ${EST[p.estado][1]}">${p.estado}</span></div>
  <div class="mu">${esc(p.tel)} · ${p.items.map(i=>i.q+'× '+esc(i.n)).join(', ')} — ${m(p.total)}</div>
  <div style="margin-top:8px">${acciones(p,'a')}</div></div>`).join('');
}
async function listaReload(){admin()}

/* ---------- ruteo ---------- */
if(API.startsWith('PEGA'))V.textContent='Falta configurar la constante API en index.html.';
else if(Q.has('admin'))admin();
else if(Q.get('c'))recibo(Q.get('c').toUpperCase());
else cliente();
</script>
</body>
</html>
